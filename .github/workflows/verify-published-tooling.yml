name: Verify pinned Android release tooling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install CLI for Gradle child tasks
        run: cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --rev dd5c16b76a960d080dadf3445f4dd5e2c33e7a9d android-repo-setup
      - name: Build with the released plugin and verify with the pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          sh ./setup.sh publishing_config check
          sh ./setup.sh workflows --check
          ./gradlew verifyImportDocs :demo-common:publishAllPublicationsToVerificationRepository \
            -PreleaseModule=demo-common -PreleaseVersion=9.8.7 --no-daemon
          sh ./setup.sh module_release check-local --module demo-common --version 9.8.7 --source "$(git rev-parse HEAD)"
