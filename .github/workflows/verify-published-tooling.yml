name: Verify pinned Android release tooling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and verify the configured CLI
        shell: bash
        run: |
          set -euo pipefail
          reference=$(sed -n "s/^tooling_ref: ['\"]*\([^'\"]*\)['\"]*$/\1/p" .project/setup/config.yaml)
          if [[ "$reference" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            archive=android-repo-setup-x86_64-unknown-linux-gnu.tar.gz
            url="https://github.com/lambdawalker/gradle.android-repo-setup/releases/download/$reference"
            mkdir "$RUNNER_TEMP/release-cli"
            cd "$RUNNER_TEMP/release-cli"
            curl -fsSL --retry 3 --max-time 60 "$url/$archive" -o "$archive"
            curl -fsSL --retry 3 --max-time 60 "$url/$archive.sha256" -o "$archive.sha256"
            sha256sum --check "$archive.sha256"
            tar -xzf "$archive"
            test "$(./android-repo-setup --version)" = "android-repo-setup ${reference#v}"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          elif [[ "$reference" =~ ^[0-9a-f]{40}$ ]]; then
            cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --rev "$reference" android-repo-setup
            android-repo-setup --version
          else
            echo 'Invalid tooling_ref'; exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build with the released plugin and verify with the pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          android-repo-setup publishing_config check
          android-repo-setup workflows --check
          ./gradlew verifyImportDocs :demo-common:publishAllPublicationsToVerificationRepository \
            -PreleaseModule=demo-common -PreleaseVersion=9.8.7 --no-daemon
          android-repo-setup module_release check-local --module demo-common --version 9.8.7 --source "$(git rev-parse HEAD)"

  verify-windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and reuse the CLI from the checkout
        shell: pwsh
        run: |
          $line = Get-Content -LiteralPath '.project/setup/config.yaml' | Where-Object { $_ -match '^tooling_ref:' } | Select-Object -First 1
          $reference = ($line -split ':', 2)[1].Trim().Trim([char]39).Trim([char]34)
          if ($reference -notmatch '^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$') { throw 'Invalid tooling_ref' }
          $exe = if ($reference.StartsWith('v')) { "bin/$reference/android-repo-setup.exe" } else { "bin/$reference/bin/android-repo-setup.exe" }
          $first = @(.\setup.bat --version)
          if ($LASTEXITCODE -ne 0 -or $first[-1] -notmatch '^android-repo-setup [0-9]+\.[0-9]+\.[0-9]+$') {
            throw "First launch failed: $first"
          }
          $expected = $first[-1]
          if ($reference.StartsWith('v') -and $expected -ne ('android-repo-setup ' + $reference.Substring(1))) { throw 'CLI version differs from tag' }
          $timestamp = (Get-Item -LiteralPath $exe).LastWriteTimeUtc
          $second = @(.\setup.bat --version)
          if ($LASTEXITCODE -ne 0 -or $second.Count -ne 1 -or $second[0] -ne $expected) {
            throw "Cached launch failed: $second"
          }
          if ((Get-Item -LiteralPath $exe).LastWriteTimeUtc -ne $timestamp) {
            throw 'Cached executable was replaced on the second run.'
          }
          git check-ignore --quiet $exe
          if ($LASTEXITCODE -ne 0) { throw 'The executable is not Git-ignored.' }
