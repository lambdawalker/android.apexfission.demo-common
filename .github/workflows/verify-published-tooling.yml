name: Verify published Android release tooling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOOLING_TAG: v0.1.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and verify the published CLI
        shell: bash
        run: |
          set -euo pipefail
          archive=android-repo-setup-x86_64-unknown-linux-gnu.tar.gz
          url="https://github.com/lambdawalker/gradle.android-repo-setup/releases/download/$TOOLING_TAG"
          mkdir "$RUNNER_TEMP/release-cli"
          cd "$RUNNER_TEMP/release-cli"
          curl -fsSL --retry 3 --max-time 60 "$url/$archive" -o "$archive"
          curl -fsSL --retry 3 --max-time 60 "$url/$archive.sha256" -o "$archive.sha256"
          sha256sum --check "$archive.sha256"
          tar -xzf "$archive"
          version="$(./android-repo-setup --version)"
          test "$version" = "android-repo-setup ${TOOLING_TAG#v}"
          echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build with the released plugin and verify with the released CLI
        shell: bash
        run: |
          set -euo pipefail
          ./setup.sh publishing_config check
          ./setup.sh workflows --check
          ./gradlew verifyImportDocs :demo-common:publishAllPublicationsToVerificationRepository \
            -PreleaseModule=demo-common -PreleaseVersion=9.8.7 --no-daemon
          ./setup.sh module_release check-local --module demo-common --version 9.8.7 --source "$(git rev-parse HEAD)"

  verify-windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and reuse the CLI from the checkout
        shell: pwsh
        run: |
          $expected = 'android-repo-setup 0.1.5'
          $exe = 'bin/v0.1.5/android-repo-setup.exe'
          $first = @(.\setup.bat --version)
          if ($LASTEXITCODE -ne 0 -or $first[-1] -ne $expected) {
            throw "First launch failed: $first"
          }
          $timestamp = (Get-Item -LiteralPath $exe).LastWriteTimeUtc
          $second = @(.\setup.bat --version)
          if ($LASTEXITCODE -ne 0 -or $second.Count -ne 1 -or $second[0] -ne $expected) {
            throw "Cached launch failed: $second"
          }
          if ((Get-Item -LiteralPath $exe).LastWriteTimeUtc -ne $timestamp) {
            throw 'Cached executable was replaced on the second run.'
          }
          git check-ignore --quiet $exe
          if ($LASTEXITCODE -ne 0) { throw 'The executable is not Git-ignored.' }
